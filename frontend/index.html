<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jobblo – Finn eller legg ut oppdrag</title>
    <meta
      name="description"
      content="Jobblo kobler deg med folk som kan gjøre jobben. Legg ut oppdraget ditt gratis, få tilbud, og betal trygt med SafePay."
    />

    <!--
      Generic social metadata for the app shell.

      This is the fallback for home and other non-listing pages, and it also gives
      iOS Messages/SMS a proper rich preview when a shared Jobblo URL is opened.
      None of these crawlers executes JavaScript, so the tags must be present in the
      server-rendered HTML and not only in the client app shell.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jobblo" />
    <meta property="og:title" content="Jobblo – Finn eller legg ut oppdrag" />
    <meta
      property="og:description"
      content="Jobblo kobler deg med folk som kan gjøre jobben. Legg ut oppdraget ditt gratis, få tilbud, og betal trygt med SafePay."
    />
    <meta property="og:url" content="https://jobblo.no" />
    <meta property="og:image" content="https://jobblo.no/assets/share-image.png" />
    <meta property="og:image:secure_url" content="https://jobblo.no/assets/share-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="nb_NO" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jobblo – Finn eller legg ut oppdrag" />
    <meta
      name="twitter:description"
      content="Jobblo kobler deg med folk som kan gjøre jobben. Legg ut oppdraget ditt gratis, få tilbud, og betal trygt med SafePay."
    />
    <meta name="twitter:image" content="https://jobblo.no/assets/share-image.png" />
    <!--
      No Google Fonts: the three render-blocking stylesheets here (Inter, Nunito, Roboto,
      Material Symbols) were ~98 KB of CSS on every load. "Inter Display" (the font the CSS
      asks for) is not a Google family, so the site was already showing the system sans-serif;
      icons come from lucide-react; admin/developer pages use the bundled Geist.
    -->
    <!--
      Google AdSense is intentionally NOT loaded here. Loading it before the
      visitor answers the cookie banner is consent after the fact under
      GDPR/ePrivacy. src/utils/cookieConsent.ts injects it, and only after an
      explicit "Godta alle". Set VITE_ADSENSE_CLIENT to enable it.
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
