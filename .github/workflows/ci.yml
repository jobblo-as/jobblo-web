name: CI

# One workflow for all app checks. Each job only runs when its own area changes
# (path filters) and they run in parallel. No Docker. Runs on pushes to every branch:
# deploy.sh only deploys a commit (on any branch) when this workflow is green for it.

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter and gitleaks-action read the PR's changed files / commits.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Detect backend changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.backend == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.backend == 'true'
        run: |
          npm ci
          echo '### Backend install: passed' >> "$GITHUB_STEP_SUMMARY"

      - name: Audit production dependencies
        if: steps.changes.outputs.backend == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        if: steps.changes.outputs.backend == 'true'
        run: |
          npm run test:quality
          echo '### Backend tests: passed' >> "$GITHUB_STEP_SUMMARY"

      # Sends totals, coverage and failing tests to the developer console (Test & Quality).
      # Runs even when tests fail; does nothing until both secrets are set.
      - name: Report test results
        if: always() && steps.changes.outputs.backend == 'true'
        env:
          QUALITY_REPORT_URL: ${{ secrets.QUALITY_REPORT_URL }}
          QUALITY_INGEST_TOKEN: ${{ secrets.QUALITY_INGEST_TOKEN }}
        run: node scripts/quality-report.js backend jest-results.json coverage/coverage-summary.json

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Audit production dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm audit --omit=dev --audit-level=high

      # Lint and typecheck block NEW errors: the step fails when the error count rises
      # above the existing backlog. Lower the numbers as the backlog is fixed (0 = clean).
      - name: Lint
        if: steps.changes.outputs.frontend == 'true'
        env:
          MAX_ERRORS: 209
        run: |
          STATUS=0; npx eslint . > lint.log 2>&1 || STATUS=$?
          # stylish summary line: "✖ N problems (E errors, W warnings)"; no line = clean
          ERRORS=$(grep -oE '\(([0-9]+) errors?' lint.log | grep -oE '[0-9]+' | tail -1)
          ERRORS=${ERRORS:-0}
          echo "### Frontend lint: $ERRORS errors (allowed $MAX_ERRORS)" >> "$GITHUB_STEP_SUMMARY"
          tail -60 lint.log
          # a crash prints no count: fail on a non-zero exit with zero counted errors
          [ "$STATUS" = 0 ] || [ "$ERRORS" -gt 0 ]
          [ "$ERRORS" -le "$MAX_ERRORS" ]

      - name: Typecheck
        if: steps.changes.outputs.frontend == 'true'
        env:
          MAX_ERRORS: 102
        run: |
          STATUS=0; npm run typecheck > tsc.log 2>&1 || STATUS=$?
          ERRORS=$(grep -c 'error TS' tsc.log || true)
          echo "### Frontend typecheck: $ERRORS errors (allowed $MAX_ERRORS)" >> "$GITHUB_STEP_SUMMARY"
          tail -60 tsc.log
          [ "$STATUS" = 0 ] || [ "$ERRORS" -gt 0 ]
          [ "$ERRORS" -le "$MAX_ERRORS" ]

      - name: Build
        if: steps.changes.outputs.frontend == 'true'
        env:
          VITE_MAIN_URL: https://example.invalid
          VITE_GOOGLE_MAPS_API_KEY: ci-build-placeholder
        run: |
          npm run build
          echo '### Frontend build: passed' >> "$GITHUB_STEP_SUMMARY"

  # ── Secret scan ────────────────────────────────────────────────────────────
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required by gitleaks-action for repositories owned by an organization (free key).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Mobile ─────────────────────────────────────────────────────────────────
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jobblo-app
    steps:
      - uses: actions/checkout@v4

      - name: Detect mobile changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            mobile:
              - 'jobblo-app/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.mobile == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: jobblo-app/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.mobile == 'true'
        run: |
          npm ci
          echo '### Mobile install: passed' >> "$GITHUB_STEP_SUMMARY"

      # critical only: Expo's build tooling ships known highs with no non-breaking fix.
      - name: Audit production dependencies
        if: steps.changes.outputs.mobile == 'true'
        run: npm audit --omit=dev --audit-level=critical

      - name: Expo config
        if: steps.changes.outputs.mobile == 'true'
        run: |
          npx --no-install expo config --type public > /dev/null
          echo '### Mobile Expo config: passed' >> "$GITHUB_STEP_SUMMARY"
