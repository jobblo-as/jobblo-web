# Jobblo — the jobblo.no site. Installed by deploy/setup-server.sh as
# /etc/nginx/sites-available/jobblo (linked from sites-enabled). /api, /socket.io, /assets,
# index.html no-cache, gzip, logs, limits and security headers come from
# snippets/jobblo-server.conf; the upstreams and maps from conf.d/jobblo-http.conf.
# The Certbot lines are the ones Certbot wrote for this server.

server {
    server_name jobblo.no www.jobblo.no;
    root /var/www/jobblo/frontend/dist;
    index index.html;

    include snippets/jobblo-server.conf;

    # Share Job Preview: always the backend renderer (it redirects people to /jobs/:id).
    location ^~ /share/job/ {
        proxy_pass http://127.0.0.1:5001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent        $http_user_agent;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = /index.html;
    }

    # Listing URLs: crawlers get the share card, people get the SPA.
    location ~ "^/(jobs|job-listing)/[0-9a-fA-F]{24}/?$" {
        error_page 418 = @jobblo_card;
        if ($jobblo_is_crawler) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location @jobblo_card {
        proxy_pass http://127.0.0.1:5001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent        $http_user_agent;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jobblo.no/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jobblo.no/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.jobblo.no) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = jobblo.no) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name jobblo.no www.jobblo.no;
    return 404; # managed by Certbot
}
