# Jobblo — http{} scope. Install as /etc/nginx/conf.d/jobblo-http.conf (Debian/Ubuntu
# nginx.conf includes conf.d/*.conf inside http{}). Pairs with jobblo-server.conf.
# Only things that MUST live at http{} scope are here; gzip etc. are in the server snippet
# so they never clash with the `gzip on;` that Debian's stock nginx.conf already has.

# --- API upstream: reused keep-alive connections instead of a TCP handshake per request.
upstream jobblo_api {
    server 127.0.0.1:5001;
    # More API processes on their own ports? List them here (round robin is fine for
    # plain HTTP, every instance shares Redis/Mongo):
    # server 127.0.0.1:5002;
    keepalive 128;             # idle connections kept per nginx worker; too few = TCP churn
                               # (TIME_WAIT / port exhaustion) once concurrency exceeds it
    keepalive_requests 10000;
    # Below Node's default server.keepAliveTimeout (5 s): nginx must drop an idle
    # connection before Node does, or a reused-just-closed socket becomes a 502.
    keepalive_timeout 4s;
}

# --- socket.io upstream: polling transport needs every request of a session on the SAME
# process, so pin by client IP. Identical to jobblo_api while there is one process.
upstream jobblo_socket {
    ip_hash;
    server 127.0.0.1:5001;
    # server 127.0.0.1:5002;
    keepalive 32;
    keepalive_timeout 4s;
}

# --- Micro-cache for anonymous public reads (see jobblo-server.conf /api/).
# 10m keys zone ≈ 80k entries; 200m on disk is far more than the JSON lists need.
proxy_cache_path /var/cache/nginx/jobblo levels=1:2 keys_zone=jobblo_micro:10m
                 max_size=200m inactive=10m use_temp_path=off;

# Routes whose body is the same for every visitor (the backend already caches them per
# URL in Redis with cacheJson / they never read req.user). Query string is part of the key.
# NOT /api/services/:id: every read increments the listing's view counter, a proxy cache
# would swallow those views (and it runs optionalAuthenticate).
map $request_method:$uri $jobblo_route_cacheable {
    default 0;
    "~^(GET|HEAD):/api/(services|services/nearby|categories|filter/options|location-filter/tree|explore/stats)/?$" 1;
}

# Auth cookies the backend reads (accessToken/refreshToken/token JWTs, connect.sid =
# express-session for the OIDC flow). Cookie names are case-sensitive, so is this regex.
map $http_cookie $jobblo_auth_cookie {
    default 0;
    "~(^|;)\s*(accessToken|refreshToken|token|connect\.sid)=" 1;
}

# Cache only when: cacheable route AND no auth cookie AND no Authorization header.
# Anything else (logged-in users, POST/PUT/DELETE, every other route) skips the cache
# both ways: never served from it (bypass) and never stored into it (no_cache).
map $jobblo_route_cacheable:$jobblo_auth_cookie:$http_authorization $jobblo_skip_cache {
    default 1;
    "1:0:" 0;
}

# WebSocket upgrade: Connection "upgrade" only when the client asked for it, otherwise
# "" so the upstream keep-alive connection is reused.
map $http_upgrade $jobblo_connection_upgrade {
    default upgrade;
    ""      "";
}

# --- Developer console → Nginx page.
# One JSON object per request: cache status, status code, timings, method and path WITHOUT the
# query string (no tokens, search terms or ids from it) and no client IP. Read by
# backend/services/monitoring/nginx.js (NGINX_ACCESS_LOG); the API user needs read access
# (e.g. `sudo usermod -aG adm <api-user>`; logrotate keeps the file group adm).
log_format jobblo_json escape=json
    '{"t":"$time_iso8601","m":"$request_method","u":"$uri","s":$status,"b":$body_bytes_sent,'
    '"rt":$request_time,"ut":"$upstream_response_time","c":"$upstream_cache_status"}';

# `combined` minus every query string. `combined` logs $request (the raw request line), so
# each mobile sign-in wrote a live bearer token (/api/auth/mobile-return?token=<JWT>) and each
# OAuth callback its ?code=&state= into access.log. Same fields otherwise, so log tools still
# parse it; the referer is cut at `?` for the same reason.
map $http_referer $jobblo_referer_path {
    default                    $http_referer;
    "~^(?<jobblo_ref>[^?#]*)[?#]" $jobblo_ref;
}
log_format jobblo_combined
    '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent "$jobblo_referer_path" "$http_user_agent"';

# Live connection counters for the same page (NGINX_STATUS_URL). Loopback only — never public.
server {
    listen 127.0.0.1:8090;
    server_name _;
    access_log off;
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
    location / { return 404; }
}
