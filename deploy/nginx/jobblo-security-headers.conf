# Jobblo security headers. Install as /etc/nginx/snippets/jobblo-security-headers.conf.
# nginx trap: a location with ANY add_header of its own drops all server-level ones, so
# jobblo-server.conf includes this at server scope AND in every location that adds a header.
# HSTS includeSubDomains: every *.jobblo.no host must serve HTTPS before this goes live.
add_header X-Frame-Options           "DENY" always;
add_header Content-Security-Policy   "frame-ancestors 'none'" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), payment=()" always;
# Full CSP in REPORT-ONLY mode: browsers log violations in the console and block nothing.
# Third-party scripts the SPA really loads: Google Maps JS (@vis.gl/react-google-maps ->
# maps.googleapis.com, which pulls maps.gstatic.com + Roboto from fonts.googleapis/gstatic)
# and AdSense after cookie consent (src/utils/cookieConsent.ts -> pagead2.googlesyndication.com,
# which pulls its ad scripts/frames from *.googlesyndication.com / *.doubleclick.net /
# *.adtrafficquality.google). Leaflet tiles and avatars are images (img-src https:).
# style-src 'unsafe-inline': Maps and React components inject <style>/style attributes.
# When the console stays clean, rename the header to Content-Security-Policy (enforce) and
# drop the frame-ancestors-only one above.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://*.adtrafficquality.google; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; frame-src https://*.googlesyndication.com https://*.doubleclick.net https://www.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
