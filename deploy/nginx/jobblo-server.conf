# Jobblo — server{} scope. Install as /etc/nginx/snippets/jobblo-server.conf and add
#     include snippets/jobblo-server.conf;
# inside the jobblo.no server{} block (the HTTPS one), next to `root .../frontend/dist;`.
# Needs jobblo-http.conf at http{} scope. Remove the block's own `location /api` and
# `location /socket.io` first (duplicate locations fail `nginx -t`). Keep its
# `location / { try_files $uri /index.html; }` — the SPA fallback lands on
# `location = /index.html` below and gets no-cache from it.

# --- Security headers (jobblo-security-headers.conf, also included in each location below
# that has its own add_header). Install that file next to this one in /etc/nginx/snippets/.
include snippets/jobblo-security-headers.conf;

# --- Client limits / timeouts
client_max_body_size 50m;    # largest API body: SafePay checkout, 6 files x 8 MB
client_body_timeout   30s;
client_header_timeout 15s;
send_timeout          30s;
keepalive_timeout     65s;
keepalive_requests    1000;

# --- Compression (nginx does it; the API has no compression middleware). Brotli needs
# the ngx_brotli module (Debian: apt install libnginx-mod-http-brotli-filter), then
# uncomment the brotli lines.
gzip on;
gzip_vary on;
gzip_proxied any;             # proxied API responses too
gzip_comp_level 5;
gzip_min_length 1024;         # below ~1 KB gzip saves nothing
gzip_types application/json application/javascript text/css text/plain text/xml
           application/xml image/svg+xml application/manifest+json font/ttf font/otf;
# brotli on;
# brotli_comp_level 5;
# brotli_min_length 1024;
# brotli_types application/json application/javascript text/css text/plain text/xml
#              application/xml image/svg+xml application/manifest+json font/ttf font/otf;

# --- Request log for the developer console's Nginx page (format in jobblo-http.conf).
# An access_log here replaces the one inherited from http{}, so the usual log is repeated
# to keep it. If this server{} already has its own access_log line, drop it: it is almost
# certainly `combined`, which logs query strings (bearer tokens, OAuth codes). Never use
# `combined` / $request / $request_uri / $args in a log format here.
access_log /var/log/nginx/access.log jobblo_combined;
access_log /var/log/nginx/jobblo.json.log jobblo_json;

# --- Static file descriptors/metadata cached in each worker
open_file_cache          max=10000 inactive=60s;
open_file_cache_valid    60s;
open_file_cache_min_uses 2;
open_file_cache_errors   on;

# --- Vite hashed bundles: the file name changes when the content does → cache forever.
location ^~ /assets/ {
    # no `always`: a 404 for a missing chunk must not be cached for a year.
    add_header Cache-Control "public, max-age=31536000, immutable";
    include snippets/jobblo-security-headers.conf;   # own add_header drops the server-level ones
    access_log off;
    try_files $uri =404;      # a missing chunk is a 404, never index.html served as JS
}

# --- The SPA shell must always be revalidated, or users keep old chunk names after a deploy.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    include snippets/jobblo-security-headers.conf;   # own add_header drops the server-level ones
}

# --- API
location /api/ {
    proxy_pass http://jobblo_api;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";               # keep upstream connections alive
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # nginx is the edge: REPLACE any client-supplied X-Forwarded-For (backend trusts loopback).
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding   "";               # cache one identity body; nginx gzips

    proxy_connect_timeout 3s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffers         16 32k;
    proxy_buffer_size     32k;

    # Micro-cache: anonymous GETs of the public routes in $jobblo_route_cacheable only.
    proxy_cache            jobblo_micro;
    proxy_cache_key        $scheme$host$request_uri;
    proxy_cache_bypass     $jobblo_skip_cache;            # never answer it from cache
    proxy_no_cache         $jobblo_skip_cache;            # never store it
    proxy_cache_valid      200 3s;                        # only 200s; 4xx/5xx/429 never cached
    proxy_cache_lock       on;                            # one request per key fills a miss
    proxy_cache_lock_timeout 3s;
    proxy_cache_background_update on;
    proxy_cache_use_stale  updating error timeout http_500 http_502 http_503 http_504 http_429;
    # Set-Cookie is deliberately NOT in proxy_ignore_headers: nginx refuses to cache a
    # response that carries Set-Cookie, so a cookie is never replayed to another visitor.
    # Upstream Cache-Control: private/no-store is likewise honoured.
    add_header X-Cache-Status $upstream_cache_status always;
    include snippets/jobblo-security-headers.conf;   # own add_header drops the server-level ones
}

# --- socket.io (websocket + long-polling fallback)
location /socket.io/ {
    proxy_pass http://jobblo_socket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $jobblo_connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 3s;
    proxy_read_timeout    120s;   # > socket.io pingInterval+pingTimeout (25 s + 20 s)
    proxy_send_timeout    120s;
    proxy_buffering       off;    # long-poll responses go out immediately
}
